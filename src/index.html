<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>TETRIS</h1>
        <canvas id="game-canvas"></canvas>
        <div class="controls">
            <h3>Controls</h3>
            <table>
                <tr><td>Move</td><td>← → / A D</td></tr>
                <tr><td>Soft Drop</td><td>↓ / S</td></tr>
                <tr><td>Hard Drop</td><td>↑ / W</td></tr>
                <tr><td>Rotate CW</td><td>X / E</td></tr>
                <tr><td>Rotate CCW</td><td>Z / Q</td></tr>
                <tr><td>Hold</td><td>C / Shift</td></tr>
                <tr><td>Pause</td><td>Space</td></tr>
                <tr><td>Restart</td><td>R</td></tr>
            </table>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
